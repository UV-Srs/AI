services:
  # ===========================================================================
  # 1. PostgreSQL Database Service
  # ===========================================================================
  db:
    image: postgres:16-alpine
    container_name: ppe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PPE_Detect}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuvraj9090M}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/postgres_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-PPE_Detect}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 2. FastAPI Backend Service (CPU Mode by default)
  # For GPU acceleration, overlay with: -f docker-compose.gpu.yml
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppe_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-PPE_Detect}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yuvraj9090M}
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8001"
    volumes:
      - ./Model:/app/Model
      - ./data:/app/data
      - ./Datasets:/app/Datasets
      - ./runs:/app/runs

  # ===========================================================================
  # 3. React Frontend Service (Served via Nginx Reverse Proxy)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ppe_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
      - "80:80"

volumes:
  postgres_data:
    driver: local
